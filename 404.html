<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page not found | Grand Blvd Studio</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#F4EEE4">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/favicon.ico" sizes="32x32">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="stylesheet" href="/assets/site.css">
<style>
  body{padding-bottom:0;min-height:100vh;display:flex;flex-direction:column}
  .lost{flex:1;display:grid;place-items:center;text-align:center;padding:72px var(--pad)}
  .lost h1{font-size:clamp(2.6rem,1.6rem + 4vw,4.4rem);margin:0 0 18px;letter-spacing:-.03em}
  .lost .eyebrow{justify-content:center}
  .lost .eyebrow::before{display:none}
  .lost .lede{margin:0 auto 30px}
  .lost .cta-row{justify-content:center}
  .lost{position:relative;isolation:isolate;color:var(--cream);background:#141a20 url("/media/end-1280.webp") center/cover no-repeat}
  .lost::before{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(180deg,rgba(14,18,24,.55),rgba(14,18,24,.8))}
  .lost h1 em{color:var(--brass)}
  .lost .lede{color:rgba(244,238,228,.88)}
  .lost .btn-primary{background:var(--cream);color:var(--ink)}
  .lost .btn-ghost{border-color:rgba(244,238,228,.5);color:var(--cream)}
</style>
</head>
<body>
<main class="lost on-dark">
  <div>
    <p class="eyebrow">Error 404</p>
    <h1>This street <em>doesn't exist.</em></h1>
    <p class="lede">The page you're looking for isn't here. Head back to the main boulevard, or text us and we'll point you the right way.</p>
    <div class="cta-row">
      <a class="btn btn-primary" href="/">Back to the homepage</a>
      <a class="btn btn-ghost" href="sms:+17273127758">Text us</a>
    </div>
  </div>
</main>
</body>
</html>
